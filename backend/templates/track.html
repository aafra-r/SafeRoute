<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Safe Path - Live Tracking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: #fff; }
    #map { height: 100vh; width: 100vw; }
    .overlay { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 8px; border: 1px solid #10B981; text-align: center; }
    .status { color: #10B981; font-weight: bold; margin-bottom: 5px; }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="status">LIVE TRACKING ACTIVE</div>
    <div style="font-size: 14px;">Updating in real-time...</div>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const token = {{ token|tojson }};
    const locationUrl = `/api/journey/${encodeURIComponent(token)}/location`;
    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri', maxZoom: 16
    }).addTo(map);

    let marker;

    async function pollLocation() {
      try {
        const res = await fetch(locationUrl);
        if (res.ok) {
          const data = await res.json();
          if (data.success && data.lat && data.lon) {
            const lat = data.lat;
            const lon = data.lon;
            if (!marker) {
              marker = L.marker([lat, lon]).addTo(map);
              map.setView([lat, lon], 16);
            } else {
              marker.setLatLng([lat, lon]);
              map.panTo([lat, lon]);
            }
          }
        }
      } catch (e) {
        console.error("Polling error", e);
      }
    }

    pollLocation();
    setInterval(pollLocation, 5000);
  </script>
</body>
</html>
